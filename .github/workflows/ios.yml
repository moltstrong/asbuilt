name: iOS CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Core tests, iOS builds, simulator screenshots
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DERIVED: ${{ github.workspace }}/build/DerivedData
      SIM_NAME: AsBuilt-CI
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          swift --version
          xcodebuild -showsdks | grep -E "iphoneos|iphonesimulator"
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -E "iPhone 1[5-9]|iPhone 2" || true

      - name: AsBuiltCore unit tests (swift test)
        working-directory: AsBuiltCore
        env:
          ASBUILT_EXPORT_DIR: ${{ github.workspace }}/artifacts/core-exports
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../core-tests.log
          # Swift Testing summary, e.g. "Test run with 53 tests in 12 suites passed after 0.02 seconds."
          grep -E "Test run with [0-9]+ tests? (in [0-9]+ suites? )?passed" ../core-tests.log

      - name: Validate generated USDZ models (usdchecker --arkit, usdcat, usdtree)
        run: |
          set -o pipefail
          cd artifacts/core-exports
          ls -la ./*.usdz
          if ! command -v usdchecker >/dev/null; then
            echo "::warning::usdchecker not available on this runner; USDZ validated locally only."
            exit 0
          fi
          for f in ./*.usdz; do
            echo "== $f"
            usdchecker --arkit "$f" 2>&1 | grep -v "RegisterBehaviorForPrimTypeId" | tee "$f.check.txt"
            grep -q "^Success!" "$f.check.txt"
            usdcat "$f" > /dev/null
            usdtree "$f" > "$f.tree.txt"
            echo "Mesh prims: $(grep -c 'def Mesh\]' "$f.tree.txt")  Materials: $(grep -c 'def Material\]' "$f.tree.txt")"
            test "$(grep -c 'def Mesh\]' "$f.tree.txt")" -ge 8
          done

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen --version
          cp -R AsBuilt.xcodeproj /tmp/committed.xcodeproj
          xcodegen generate
          if ! diff -rq /tmp/committed.xcodeproj AsBuilt.xcodeproj; then
            echo "::warning::Committed AsBuilt.xcodeproj differs from xcodegen output (non-fatal)."
          fi

      - name: Create simulator
        id: sim
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rs = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          rs.sort(key=lambda r: [int(x) for x in r["version"].split(".")])
          print(rs[-1]["identifier"])')
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          names = [d["identifier"] for d in json.load(sys.stdin)["devicetypes"]]
          prefs = [n for n in names if "iPhone-17-Pro" in n and "Max" not in n] + [n for n in names if "iPhone-16-Pro" in n and "Max" not in n] + [n for n in names if "iPhone" in n]
          print(prefs[0])')
          echo "runtime=$RUNTIME device=$DEVICE_TYPE"
          UDID=$(xcrun simctl create "$SIM_NAME" "$DEVICE_TYPE" "$RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$SIM_NAME"

      - name: Build + test for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project AsBuilt.xcodeproj -scheme AsBuilt \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED" \
            -resultBundlePath build/AppTests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee app-tests.log | grep -E "error:|warning: .*AsBuilt/|Test Case|Executed|TEST (SUCCEEDED|FAILED)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" app-tests.log

      - name: Build for iOS device (generic/platform=iOS, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project AsBuilt.xcodeproj -scheme AsBuilt -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee device-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" device-build.log
          APP=build/DeviceDerivedData/Build/Products/Release-iphoneos/AsBuilt.app
          ls -la "$APP"
          file "$APP/AsBuilt"
          otool -L "$APP/AsBuilt" | grep -E "RoomPlan|RealityKit|RealityFoundation|SceneKit|QuickLook" || true
          nm -u "$APP/AsBuilt" | grep -c -E "RoomPlan|ObjectCapture|PhotogrammetrySession" || true

      - name: App Store upload readiness (built device app)
        run: |
          APP=build/DeviceDerivedData/Build/Products/Release-iphoneos/AsBuilt.app
          INFO="$APP/Info.plist"
          get() { plutil -extract "$1" raw "$INFO"; }
          echo "CFBundleIdentifier         = $(get CFBundleIdentifier)"
          echo "CFBundleShortVersionString = $(get CFBundleShortVersionString)"
          echo "CFBundleVersion            = $(get CFBundleVersion)"
          echo "MinimumOSVersion           = $(get MinimumOSVersion)"
          test "$(get CFBundleShortVersionString)" = "1.0"
          test "$(get ITSAppUsesNonExemptEncryption)" = "false"
          for key in NSCameraUsageDescription NSPhotoLibraryAddUsageDescription; do
            echo "$key = $(get $key)"
          done
          plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName raw "$INFO"
          test -f "$APP/Assets.car"
          test -f "$APP/PrivacyInfo.xcprivacy" && plutil -lint "$APP/PrivacyInfo.xcprivacy"
          ICON=AsBuilt/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$ICON"
          sips -g hasAlpha "$ICON" | grep -q "hasAlpha: no"
          sips -g pixelWidth "$ICON" | grep -q "pixelWidth: 1024"

      - name: Simulator screenshots
        run: |
          APP="$DERIVED/Build/Products/Debug-iphonesimulator/AsBuilt.app"
          chmod +x scripts/capture-screenshots.sh
          scripts/capture-screenshots.sh "$APP" "${{ steps.sim.outputs.udid }}" artifacts/screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/screenshots
          if-no-files-found: warn

      - name: Upload logs and sample exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-and-exports
          path: |
            core-tests.log
            app-tests.log
            device-build.log
            artifacts/core-exports
          if-no-files-found: warn

  ios27:
    name: iOS 27 simulator (Xcode 27) tests + launch smoke test
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DERIVED: ${{ github.workspace }}/build/DerivedData27
      SIM_NAME: AsBuilt-iOS27
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          swift --version
          xcodebuild -showsdks | grep -E "iphoneos|iphonesimulator"
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -E "iPhone 1[7-9]|iPhone 2" || true
          command -v usdchecker || echo "usdchecker not on PATH"

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Create iOS 27 simulator (iPhone 18 Pro preferred)
        id: sim
        run: |
          # Candidate (runtime, device type) pairs: newest iOS 27 runtime first, iPhone 18 Pro first,
          # only device types the runtime says it supports (simctl create fails with
          # "Incompatible device" otherwise).
          xcrun simctl list runtimes -j > runtimes.json
          xcrun simctl list devicetypes -j > devicetypes.json
          python3 - > sim-candidates.txt <<'PY'
          import json
          rts = [r for r in json.load(open("runtimes.json"))["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          rts.sort(key=lambda r: [int(x) for x in r["version"].split(".")], reverse=True)
          ios27 = [r for r in rts if r["version"].split(".")[0] == "27"]
          if not ios27:
              raise SystemExit("no iOS 27 runtime on this image: " + ", ".join(r["version"] for r in rts))
          all_types = [d["identifier"] for d in json.load(open("devicetypes.json"))["devicetypes"]]
          def rank(ident):
              plain = "Max" not in ident and "Plus" not in ident
              if "iPhone-18-Pro" in ident and plain: return 0
              if "iPhone-18" in ident: return 1
              if "iPhone-17-Pro" in ident and plain: return 2
              if "iPhone" in ident: return 3
              return None
          pairs = []
          for r in ios27:
              supported = [d["identifier"] for d in r.get("supportedDeviceTypes", [])] or all_types
              for d in sorted((d for d in supported if rank(d) is not None), key=rank):
                  pairs.append((rank(d), r["identifier"], d))
          pairs.sort(key=lambda p: p[0])  # best device first; runtimes stay newest-first within a rank
          for _, r, d in pairs:
              print(r, d)
          PY
          head -8 sim-candidates.txt
          UDID=""
          while read -r RUNTIME DEVICE_TYPE; do
            if UDID=$(xcrun simctl create "$SIM_NAME" "$DEVICE_TYPE" "$RUNTIME" 2>sim-create.err); then
              echo "created runtime=$RUNTIME device=$DEVICE_TYPE udid=$UDID"
              break
            fi
            echo "skip $RUNTIME $DEVICE_TYPE: $(tr '\n' ' ' < sim-create.err)"
            UDID=""
          done < sim-candidates.txt
          test -n "$UDID"
          {
            echo "udid=$UDID"
            echo "runtime=$RUNTIME"
            echo "device=$DEVICE_TYPE"
          } >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$SIM_NAME"

      - name: Build app + tests for iOS 27 simulator
        id: build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project AsBuilt.xcodeproj -scheme AsBuilt \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build27.log | grep -E "error:|warning: .*AsBuilt/|BUILD (SUCCEEDED|FAILED)|TEST BUILD (SUCCEEDED|FAILED)" || true
          grep -qE "(TEST )?BUILD SUCCEEDED" build27.log

      - name: Launch smoke test (fresh install, no launch args, then 3D model screen)
        id: smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          chmod +x scripts/ios-launch-smoke.sh
          scripts/ios-launch-smoke.sh "$DERIVED/Build/Products/Debug-iphonesimulator/AsBuilt.app" \
            "${{ steps.sim.outputs.udid }}" artifacts/screenshots-ios27

      - name: Validate the model.usdz the app wrote on iOS 27
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        run: |
          set -o pipefail
          f=artifacts/screenshots-ios27/model.usdz
          test -s "$f"
          usdchecker --arkit "$f" 2>&1 | grep -v "RegisterBehaviorForPrimTypeId" | tee usdchecker-ios27.txt
          grep -q "^Success!" usdchecker-ios27.txt
          usdtree "$f" | head -40

      - name: App tests on iOS 27 simulator
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project AsBuilt.xcodeproj -scheme AsBuilt \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED" \
            -resultBundlePath build/AppTests27.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee app-tests27.log | grep -E "error:|Test Case|Executed|TEST (EXECUTE )?(SUCCEEDED|FAILED)|Exception|crash" || true
          grep -qE "TEST (EXECUTE )?SUCCEEDED" app-tests27.log

      - name: Collect simulator crash reports
        if: always()
        run: |
          mkdir -p artifacts/screenshots-ios27/diagnostics
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 2 -type f -iname '*AsBuilt*' -exec cp {} artifacts/screenshots-ios27/diagnostics/ \; 2>/dev/null || true
          ls -la artifacts/screenshots-ios27/diagnostics || true

      - name: Upload iOS 27 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-ios27
          path: artifacts/screenshots-ios27
          if-no-files-found: warn

      - name: Upload iOS 27 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ios27
          path: |
            build27.log
            app-tests27.log
            usdchecker-ios27.txt
          if-no-files-found: warn
