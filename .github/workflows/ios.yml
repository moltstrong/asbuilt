name: iOS 27 repro

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios27:
    name: iOS 27 simulator (Xcode 27) tests + launch smoke test
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DERIVED: ${{ github.workspace }}/build/DerivedData27
      SIM_NAME: AsBuilt-iOS27
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          swift --version
          xcodebuild -showsdks | grep -E "iphoneos|iphonesimulator"
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -E "iPhone 1[7-9]|iPhone 2" || true
          command -v usdchecker || echo "usdchecker not on PATH"

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Create iOS 27 simulator (iPhone 18 Pro preferred)
        id: sim
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rs = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          rs.sort(key=lambda r: [int(x) for x in r["version"].split(".")])
          ios27 = [r for r in rs if r["version"].split(".")[0] == "27"]
          if not ios27:
              sys.exit("no iOS 27 runtime on this image: " + ", ".join(r["version"] for r in rs))
          print(ios27[-1]["identifier"])')
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          names = [d["identifier"] for d in json.load(sys.stdin)["devicetypes"]]
          def pick(tag): return [n for n in names if tag in n and "Max" not in n and "Plus" not in n]
          prefs = pick("iPhone-18-Pro") + pick("iPhone-17-Pro") + [n for n in names if "iPhone" in n]
          print(prefs[0])')
          echo "runtime=$RUNTIME device=$DEVICE_TYPE"
          UDID=$(xcrun simctl create "$SIM_NAME" "$DEVICE_TYPE" "$RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$SIM_NAME"

      - name: Build app + tests for iOS 27 simulator
        id: build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project AsBuilt.xcodeproj -scheme AsBuilt \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build27.log | grep -E "error:|warning: .*AsBuilt/|BUILD (SUCCEEDED|FAILED)|TEST BUILD (SUCCEEDED|FAILED)" || true
          grep -qE "(TEST )?BUILD SUCCEEDED" build27.log

      - name: Launch smoke test (fresh install, no launch args, then 3D model screen)
        id: smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          chmod +x scripts/ios-launch-smoke.sh
          scripts/ios-launch-smoke.sh "$DERIVED/Build/Products/Debug-iphonesimulator/AsBuilt.app" \
            "${{ steps.sim.outputs.udid }}" artifacts/screenshots-ios27

      - name: App tests on iOS 27 simulator
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project AsBuilt.xcodeproj -scheme AsBuilt \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED" \
            -resultBundlePath build/AppTests27.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee app-tests27.log | grep -E "error:|Test Case|Executed|TEST (EXECUTE )?(SUCCEEDED|FAILED)|Exception|crash" || true
          grep -qE "TEST (EXECUTE )?SUCCEEDED" app-tests27.log

      - name: Collect simulator crash reports
        if: always()
        run: |
          mkdir -p artifacts/screenshots-ios27/diagnostics
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 2 -type f -iname '*AsBuilt*' -exec cp {} artifacts/screenshots-ios27/diagnostics/ \; 2>/dev/null || true
          ls -la artifacts/screenshots-ios27/diagnostics || true

      - name: Upload iOS 27 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-ios27
          path: artifacts/screenshots-ios27
          if-no-files-found: warn

      - name: Upload iOS 27 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ios27
          path: |
            build27.log
            app-tests27.log
          if-no-files-found: warn
