name: AsBuilt
options:
  bundleIdPrefix: com.moltstrong
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "7"
    DEVELOPMENT_TEAM: ""
packages:
  AsBuiltCore:
    path: AsBuiltCore
targets:
  AsBuilt:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AsBuilt
    dependencies:
      - package: AsBuiltCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moltstrong.asbuilt
        PRODUCT_NAME: AsBuilt
        INFOPLIST_FILE: AsBuilt/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  AsBuiltTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AsBuiltTests
    dependencies:
      - target: AsBuilt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moltstrong.asbuilt.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AsBuilt.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AsBuilt"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
schemes:
  AsBuilt:
    build:
      targets:
        AsBuilt: all
        AsBuiltTests: [test]
    test:
      config: Debug
      targets:
        - AsBuiltTests
    run:
      config: Debug
